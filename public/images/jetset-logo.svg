<svg xmlns="http://www.w3.org/2000/svg" width="520" height="140" viewBox="0 0 520 140" role="img" aria-label="JetSet Travel Cyprus logo">
  <!-- White "JetSet" + Gold "TRAVEL" — designed for dark backgrounds (brand-navy / brand-dark) -->
  <!-- Two horizontal accent lines -->
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
    <path d="M12 95h320"/>
    <path d="M12 112h492"/>
  </g>
  <!-- JetSet wordmark in white -->
  <g font-family="'DM Sans', 'Montserrat', 'Lato', Arial, sans-serif" font-weight="800" letter-spacing="0.5">
    <text x="16" y="84" font-size="88" fill="#FFFFFF">JetSet</text>
  </g>
  <!-- TRAVEL in brand-gold -->
  <g font-family="'DM Sans', 'Montserrat', 'Lato', Arial, sans-serif" font-weight="700" letter-spacing="5">
    <text x="348" y="84" font-size="36" fill="#C9A84C">TRAVEL</text>
  </g>
</svg>
