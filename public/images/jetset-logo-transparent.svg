<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="JetSet Travel Cyprus logo">
  <!-- Transparent background (no rect) -->
  <!-- JetSet text in navy -->
  <text x="100" y="200" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" font-size="150" fill="#1B2A4A" letter-spacing="2">JetSet</text>
  <!-- Three decorative horizontal lines under JetSet -->
  <line x1="100" y1="225" x2="620" y2="225" stroke="#1B2A4A" stroke-width="4"/>
  <line x1="100" y1="240" x2="560" y2="240" stroke="#1B2A4A" stroke-width="3"/>
  <line x1="100" y1="253" x2="500" y2="253" stroke="#1B2A4A" stroke-width="2.5"/>
  <!-- TRAVEL text in gold -->
  <text x="670" y="200" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="120" fill="#C9A84C" letter-spacing="10">TRAVEL</text>
</svg>
